name: PR Tests

on:
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Verify database file
      run: |
        echo "Checking database file..."
        ls -lh data/Iiams.rmtree
        file data/Iiams.rmtree
        echo "File size: $(du -h data/Iiams.rmtree | cut -f1)"

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Run linting
      run: |
        uv run ruff check .
        uv run black --check .

    - name: Debug CLI command
      run: uv run python debug_test.py
      env:
        RM_DATABASE_PATH: data/Iiams.rmtree
        DEFAULT_LLM_PROVIDER: anthropic
        LOG_LEVEL: DEBUG

    - name: Run tests with coverage
      run: uv run pytest -v -s --tb=short --cov=rmagent --cov-report=term-missing --cov-fail-under=80
      env:
        # Set test environment variables
        RM_DATABASE_PATH: data/Iiams.rmtree
        DEFAULT_LLM_PROVIDER: anthropic
        LOG_LEVEL: WARNING

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: always()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
