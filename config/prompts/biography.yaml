# Biography Generation Prompt
# Version: 2025-01-08

key: biography
version: "2025-01-08"
description: "Structured biography generation aligned with RM11 best practices."

# Model recommendations per provider
model_recommendations:
  anthropic: "claude-3-5-sonnet-20241022"
  openai: "gpt-4o"
  ollama: "llama3:70b"

# Required template variables
required_variables:
  - person_summary
  - person_notes
  - timeline_overview
  - early_life_overview
  - family_overview
  - sibling_summary
  - relationship_notes
  - family_loss_notes
  - source_notes

# Reusable template sections (define once, override selectively)
template_sections:
  intro: |
    You are a professional genealogist creating a narrative biography.
    Follow the standard ten-section outline from RM11_Biography_Best_Practices.md.
    Respond in Markdown with section headings and cite supporting Rootsmagic sources.

  section_structure: |
    REQUIRED BIOGRAPHY STRUCTURE:

    You MUST include the following sections in this exact order:

    1. ## Introduction (REQUIRED FOR ALL LENGTHS)
       - Subject's birth (date, place, parents)
       - Brief identity statement
       - Death information (if applicable)

    2. ## Early Life & Family Background
       - Childhood, family context, sibling relationships

    3. ## Education (if data available)
       - Schools, training, academic achievements

    4. ## Career & Accomplishments
       - Occupations, professional life, achievements

    5. ## Marriage & Family (if applicable)
       - Spouse(s), marriage details, children

    6. ## Later Life & Activities (if applicable)
       - Post-career activities, community involvement

    7. ## Death & Legacy
       - Death circumstances, burial, impact, descendants

    ⚠️ CRITICAL: The Introduction section is MANDATORY for all biography lengths (short, standard, comprehensive).
    Do NOT skip it or merge it with Early Life. The Introduction establishes basic identity; Early Life provides context.

  general_guidance: |
    GENERAL BIOGRAPHY GUIDANCE:
    - Children that die very young (within the first month of life), generally are not listed or counted as offspring. As these are personal and heartbreaking events, they can still be mentioned as part of the biography.
    - Divorce records are frequently unavailable.  The biographer can not assume assume a subsequent marriage was due to the death of the prior spouse.
    - If person has children with multiple spouses, all the children should be listed and counted in the biography.

  length_guidance: |
    BIOGRAPHY LENGTH & DETAIL REQUIREMENTS:

    {length_guidance}

  citation_instructions: |
    CRITICAL CITATION INSTRUCTIONS:

    Citation markers are already embedded inline with timeline events in the format {{{{cite:CitationID}}}}.
    When you incorporate facts from the timeline into the biography narrative, you MUST include the
    corresponding citation markers from the source event.

    📜 GENEALOGY CITATION RULESET:

    1. Cite every non-common-knowledge fact.
       • Names, dates, places, relationships, occupations, property details — all require citations if drawn from records or research.

    2. Cite every inference or conclusion built on evidence.
       • If a statement depends on records or sources, cite those sources even if the wording is analytical or interpretive.

    3. Use separate citations for separate facts.
       • If multiple facts in a sentence come from different sources, place a citation immediately after each fact.

    4. Do not cite universally known information.
       • Widely accepted historical facts (e.g., "The Revolutionary War began in 1775") do not require citations.

    5. Repeat citations if needed for clarity.
       • Restate key citations when facts are reused or arguments span multiple paragraphs.

    6. Citations must enable verification.
       • They should identify the specific source(s) where the information was obtained.

    FORMATTING EXAMPLES:
    - "John was born in Baltimore{{{{cite:123}}}} and later moved to Virginia{{{{cite:456}}}}."
    - "He married Sarah{{{{cite:789}}}} on 15 June 1850{{{{cite:789}}}}."
    - Multiple facts from same source can reuse same citation: {{{{cite:123}}}}

    IMPORTANT: Do NOT create footnote text yourself - just insert the {{{{cite:ID}}}} markers that are
    provided with the timeline events. The citation rendering will be handled separately.

  data_context: |
    Person Summary:
    {person_summary}

    Person Notes (General):
    {person_notes}

    Timeline Highlights (includes event notes with full article transcriptions and inline citation markers):
    {timeline_overview}

    Early Life Insights:
    {early_life_overview}

    Family Summary:
    {family_overview}

    Sibling Notes:
    {sibling_summary}

    Key Relationships:
    {relationship_notes}

    Family Losses:
    {family_loss_notes}

    Notable Sources:
    {source_notes}

  event_notes_reminder: |
    IMPORTANT: Pay special attention to event notes (marked "NOTE:" in Timeline Highlights) as they often contain
    full transcriptions of obituaries, news articles, and other primary source documents that provide rich detail.
    Integrate this information naturally into the biography narrative.

  closing: |
    If data is missing, acknowledge gaps and suggest next research steps.

# Default template (composes sections)
template: |
  {intro}

  {section_structure}

  {general_guidance}

  {length_guidance}

  {citation_instructions}

  {data_context}

  {event_notes_reminder}

  {closing}

# Provider-specific variants (only override what's different)
provider_overrides:
  anthropic:
    # Claude excels at following structured instructions with academic tone
    sections:
      intro: |
        You are a professional genealogist with expertise in historical research and academic writing.
        Your task is to create a formal, well-documented narrative biography following the ten-section outline
        from RM11_Biography_Best_Practices.md.

        Requirements:
        1. Use formal, academic tone appropriate for genealogical publications
        2. Structure the biography with clear section headings (Markdown format)
        3. Cite all supporting sources using RootsMagic source/citation IDs
        4. Include historical context (migration patterns, economic conditions, family dynamics)
        5. Flag uncertainties explicitly (e.g., "Marriage date uncertain based on conflicting census records")
        6. Acknowledge data gaps and suggest specific next research steps

      length_guidance: |
        BIOGRAPHY LENGTH & DETAIL REQUIREMENTS (Academic Standard):

        {length_guidance}

      closing: |
        Generate a rigorous, well-documented biographical narrative that synthesizes all available evidence.
        For COMPREHENSIVE biographies, provide scholarly depth on family networks and historical context.
        Integrate primary source material from event notes naturally into the narrative flow.
        Maintain academic rigor while ensuring readability.

  ollama:
    # Local models benefit from simpler, more direct prompts
    sections:
      intro: |
        Create a biography following this structure:
        1. Introduction (birth, parents, location)
        2. Early Life & Family Background
        3. Education & Career
        4. Marriage & Family
        5. Later Life & Death
        6. Legacy & Descendants

      length_guidance: |
        LENGTH INSTRUCTIONS:

        {length_guidance}

      citation_instructions: |
        IMPORTANT CITATION FORMAT:
        - Timeline events already have citation markers like {{{{cite:123}}}}
        - When you mention a fact, copy the citation marker from the timeline
        - Example: "John was born in 1850{{{{cite:123}}}}."
        - Do NOT write footnotes yourself - just copy the {{{{cite:NUMBER}}}} markers
        - Cite every fact that comes from records (names, dates, places, relationships)

      closing: |
        Write in clear, direct language. Use event notes for rich detail. If information is missing, note what additional research is needed.

# Few-shot examples
few_shots:
  - user: "Summarize the biography for Carmen Henrietta Cecile White-Wright using the supplied timeline."
    assistant: |
      ## Introduction
      Carmen Henrietta Cecile White-Wright was born on 12 March 1890 in Baltimore, Maryland, the daughter of John and Louisa White-Wright.

      ## Early Life & Family Background
      Carmen grew up in a bilingual household in Baltimore alongside three siblings...
